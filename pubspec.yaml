name: simorgh_device
description: دستگاه حضور و غیاب اندروید سیمرغ‌کارا — ترمینال تردد با تشخیص چهره
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # networking + storage
  http: ^1.2.2
  shared_preferences: ^2.3.2

  # camera + on-device face detection & embedding
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.12.0
  tflite_flutter: ^0.10.4
  image: ^4.2.0

  # device services
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/branding/

# Android launcher icon generated from the app logo.
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/logo.png
  min_sdk_android: 21
