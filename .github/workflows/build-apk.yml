name: Build simorgh-device APK

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        # Use the latest stable Flutter: the resolved plugin versions
        # (geolocator_android, mlkit, …) require compileSdk 35 and the newer
        # Flutter Gradle plugin, which older Flutter releases don't provide.
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        # The repo keeps only a custom AndroidManifest.xml; this generates the
        # Gradle/MainActivity scaffolding without touching existing files.
        # --project-name is required because the checkout dir ("simorgh-device")
        # has a hyphen, which is not a valid Dart package name.
        run: flutter create --org ir.simorghkara --project-name simorgh_device --platforms=android .

      - name: Patch Gradle properties for plugin compatibility
        # 1) tflite_flutter compiles Java at 1.8 while Kotlin defaults to 17
        #    under JDK 17, tripping KGP's strict JVM-target check.
        # 2) The bundled TensorFlow Lite AARs (tensorflow-lite / -gpu / -api)
        #    all declare the org.tensorflow.lite namespace, which AGP rejects as
        #    a duplicate. uniquePackageNames=false relaxes that check.
        run: |
          {
            echo "kotlin.jvm.target.validation.mode=warning"
            echo "android.uniquePackageNames=false"
          } >> android/gradle.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icon from logo
        run: dart run flutter_launcher_icons

      - name: Force modern compileSdk and disable R8 for plugins
        # tflite_flutter's Android module pins compileSdk 31, but its transitive
        # AndroidX deps require 33-34, which AGP treats as a hard error. A Gradle
        # init script (DSL-agnostic) raises compileSdk on every Android module
        # and disables R8 shrinking for the app (unneeded for a test build).
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/simorgh-fixes.gradle <<'EOF'
          allprojects {
              afterEvaluate { proj ->
                  def androidExt = proj.extensions.findByName('android')
                  if (androidExt != null) {
                      try { androidExt.compileSdk = 36 } catch (ignored) {
                          try { androidExt.compileSdkVersion(36) } catch (ignored2) {}
                      }
                  }
                  if (androidExt != null && proj.plugins.hasPlugin('com.android.application')) {
                      def rel = androidExt.buildTypes.getByName('release')
                      try { rel.minifyEnabled = false } catch (ignored) {}
                      try { rel.shrinkResources = false } catch (ignored) {}
                  }
              }
          }
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: simorgh-device-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
